{% extends "layout.html" %}

{% block title %}{{ article.title }} - SEO Tool{% endblock %}

{% block content %}
    <div class="article-view">
        <div class="article-header">
            <h1>{{ article.title }}</h1>
            <p><strong>Meta Description:</strong> {{ article.meta_description }}</p>
            <p><strong>Tags:</strong> {{ article.tags }}</p>
            <a href="{{ url_for('site.view_site', site_id=article.topic_cluster.site_id) }}" class="button-secondary">Back to Site Details</a>
        </div>

        <hr>

        <div class="article-body">
            {{ article.body_markdown | markdown | safe }}
        </div>
    </div>
{% endblock %}
